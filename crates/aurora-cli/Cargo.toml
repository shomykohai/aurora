[package]
name = "aurora-cli"
description = "Aurora CLI is a command line tool for interacting with some Sonix Keyboard"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "aurora"
path = "src/main.rs"
doc = false

[dependencies]
anstream = "0.6"
anstyle = "1.0"
anyhow = "1.0.104"
aurora.workspace = true
clap = { version = "4.6.7", features = ["derive"] }
clap-num = "1.2"
config = { version = "0.15.26", default-features = false, features = ["json"] }
dirs = "7.0.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.145"

[lints]
workspace = true
